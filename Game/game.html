<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matcha Racer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f170f;
      color: #e5ebe5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #354d35;
    }
    canvas { display: block; background: #1b281b; }
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      color: #a3b8a3;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(15, 23, 15, 0.85);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #354d35;
    }
    #backBtn {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 8px 16px;
      background: #436043;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s;
    }
    #backBtn:hover { background: #587a58; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div class="hud">
      <div class="hud-box">SCORE: <span id="scoreText">0</span></div>
      <div class="hud-box">SPEED: <span id="speedText">0</span> KM/H</div>
    </div>
    <canvas id="raceCanvas" width="400" height="600"></canvas>
    <a href="index.html" id="backBtn">← Back to Repository</a>
  </div>

  <script>
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const speedText = document.getElementById('speedText');

    let score = 0;
    let speed = 5;
    let gameOver = false;

    const player = {
      x: 180,
      y: 480,
      width: 40,
      height: 70,
      speedX: 0
    };

    const obstacles = [];
    const keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function spawnObstacle() {
      const lanes = [60, 140, 220, 300];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      obstacles.push({
        x: lane,
        y: -80,
        width: 40,
        height: 70,
        speed: Math.random() * 2 + 3
      });
    }

    setInterval(() => {
      if (!gameOver) spawnObstacle();
    }, 1200);

    function update() {
      if (gameOver) return;

      // Controls
      if (keys['ArrowLeft'] || keys['a']) player.x -= 5;
      if (keys['ArrowRight'] || keys['d']) player.x += 5;

      // Road Boundaries
      if (player.x < 40) player.x = 40;
      if (player.x > 320) player.x = 320;

      // Move Obstacles
      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.y += obs.speed + (speed * 0.5);

        // Collision Check
        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          gameOver = true;
        }
      }

      // Cleanup offscreen obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (obstacles[i].y > canvas.height) {
          obstacles.splice(i, 1);
          score += 10;
        }
      }

      scoreText.innerText = score;
      speedText.innerText = Math.floor(speed * 20);
      speed += 0.001;
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1b281b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Road Grass Borders
      ctx.fillStyle = '#2a3d2a';
      ctx.fillRect(0, 0, 40, canvas.height);
      ctx.fillRect(360, 0, 40, canvas.height);

      // Lane Markings
      ctx.strokeStyle = '#587a58';
      ctx.setLineDash([20, 20]);
      ctx.lineWidth = 2;
      [130, 210, 290].forEach(laneX => {
        ctx.beginPath();
        ctx.moveTo(laneX, 0);
        ctx.lineTo(laneX, canvas.height);
        ctx.stroke();
      });

      // Player Car
      ctx.fillStyle = '#82a082';
      ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = '#f4f7f4';
      ctx.fillRect(player.x + 5, player.y + 15, 30, 15); // Windshield

      // Enemy Cars
      ctx.fillStyle = '#cebcbe';
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      });

      // Game Over Overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 15, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#e5ebe5';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.font = '14px monospace';
        ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && gameOver) {
        score = 0;
        speed = 5;
        obstacles.length = 0;
        player.x = 180;
        gameOver = false;
      }
    });

    loop();
  </script>
</body>
</html>
