<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#16302b; --board:#1f4038; --grid:#254a41; --snake:#e8d44d; --head:#fff3a0; --food:#ef6f5e; --text:#f1efe4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  header { width: min(92vw, 420px); display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 1.8rem; font-weight: 700; }
  a { color: var(--head); }
  .scores { font-size: 1.05rem; display: flex; gap: 16px; }
  .wrap { position: relative; width: min(92vw, 420px); }
  canvas { width: 100%; height: auto; display: block; background: var(--board); border-radius: 10px; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(22,48,43,.82); border-radius: 10px; text-align: center; padding: 16px; }
  #overlay.hidden { display: none; }
  #overlay p { margin: 0; font-size: 1.1rem; }
  button { font: inherit; font-size: 1.05rem; padding: 10px 22px; border: 0; border-radius: 8px; background: var(--snake); color: #1b2b20; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--head); outline-offset: 2px; }
  .pad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 54px); gap: 8px; }
  .pad button { padding: 0; font-size: 1.4rem; background: var(--grid); color: var(--text); }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
  <header>
    <h1>Snake</h1>
    <div class="scores"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  </header>
  <div class="wrap">
    <canvas id="c" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="overlay">
      <p id="msg">Use the arrow keys or WASD to move. Press Space to pause.</p>
      <button id="start">Start game</button>
    </div>
  </div>
  <div class="pad" aria-label="On-screen controls">
    <button class="up" data-d="up" aria-label="Up">&#9650;</button>
    <button class="left" data-d="left" aria-label="Left">&#9664;</button>
    <button class="down" data-d="down" aria-label="Down">&#9660;</button>
    <button class="right" data-d="right" aria-label="Right">&#9654;</button>
  </div>
  <a href="../index.html">Back to home</a>

<script>
(function () {
  var N = 20, S = 20;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay'), msg = document.getElementById('msg'), startBtn = document.getElementById('start');
  var DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  var snake, dir, queue, food, score, timer, running = false, paused = false, best = 0;
  try { best = parseInt(localStorage.getItem('snakeBest'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    do { food = { x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N) }; }
    while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }
  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = DIRS.right; queue = []; score = 0; scoreEl.textContent = 0;
    placeFood(); draw();
  }
  function speed() { return Math.max(60, 130 - score * 3); }
  function loop() { step(); if (running && !paused) timer = setTimeout(loop, speed()); }
  function start() {
    reset(); running = true; paused = false; overlay.classList.add('hidden');
    clearTimeout(timer); timer = setTimeout(loop, speed());
  }
  function over() {
    running = false; clearTimeout(timer);
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snakeBest', best); } catch (e) {} }
    msg.textContent = 'Game over. You scored ' + score + '.';
    startBtn.textContent = 'Play again'; overlay.classList.remove('hidden'); startBtn.focus();
  }
  function step() {
    if (queue.length) dir = queue.shift();
    var h = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
    var hitsBody = snake.slice(0, -1).some(function (s) { return s.x === h.x && s.y === h.y; });
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || hitsBody) return over();
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; scoreEl.textContent = score; placeFood(); }
    else snake.pop();
    draw();
  }
  function turn(name) {
    var d = DIRS[name], last = queue.length ? queue[queue.length-1] : dir;
    if (d[0] === -last[0] && d[1] === -last[1]) return;
    if (d === last) return;
    if (queue.length < 2) queue.push(d);
  }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) { clearTimeout(timer); msg.textContent = 'Paused'; startBtn.textContent = 'Resume'; overlay.classList.remove('hidden'); }
    else { overlay.classList.add('hidden'); timer = setTimeout(loop, speed()); }
  }
  function draw() {
    ctx.fillStyle = '#1f4038'; ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#254a41';
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i*S, j*S, S, S);
    ctx.fillStyle = '#ef6f5e'; ctx.beginPath(); ctx.arc(food.x*S + S/2, food.y*S + S/2, S/2 - 3, 0, Math.PI*2); ctx.fill();
    snake.forEach(function (s, k) {
      ctx.fillStyle = k === 0 ? '#fff3a0' : '#e8d44d';
      ctx.fillRect(s.x*S + 1, s.y*S + 1, S - 2, S - 2);
    });
  }

  var KEYS = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { if (e.target === startBtn) return; e.preventDefault(); togglePause(); return; }
    if (KEYS[e.key]) { e.preventDefault(); if (running && !paused) turn(KEYS[e.key]); }
  });
  startBtn.addEventListener('click', function () { if (paused) togglePause(); else start(); });
  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
    b.addEventListener('click', function () { if (running && !paused) turn(b.dataset.d); });
  });
  var tx, ty;
  cv.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', function (e) {
    if (!running || paused || tx == null) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  reset();
})();
</script>
</body>
</html>
